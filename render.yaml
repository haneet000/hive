services:
  # Python FastAPI Backend Service
  - type: web
    name: hive-backend
    env: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m scripts.ingest
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hive-db
          property: connectionString

  # React Frontend Static Site
  - type: web
    name: hive-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_TARGET
        value: https://hive-upxa.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hive-db
    plan: free
