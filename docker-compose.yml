version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hive_postgres
    restart: always
    environment:
      POSTGRES_USER: hive_user
      POSTGRES_PASSWORD: hive_password
      POSTGRES_DB: hive_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive_user -d hive_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hive_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://hive_user:hive_password@db:5432/hive_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hive_frontend
    restart: always
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
